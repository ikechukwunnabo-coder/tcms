{% extends "portal/base.html" %}
{% block title %}Confirm your email �?" TASL Training Centre Portal{% endblock %}

{% block content %}
<section class="shell narrow">
  <div class="panel panel-center">
    <h1>Confirm your email address</h1>
    <p class="panel-lede">Click the button below to verify your email and finish creating your learner record.</p>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="token" value="{{ token }}">
      <button type="submit" class="btn btn-primary btn-block">Verify my email</button>
    </form>
  </div>
</section>
{% endblock %}
