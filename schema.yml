          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - certificate_count
      - corporate_account
      - corporate_account_name
      - created_at
      - delivered_at
      - delivered_to
      - id
      - status
      - updated_at
      - zip_file_hash
      - zip_file_ref
    CertificateBatchStatusEnum:
      enum:
      - collecting
      - assembling
      - ready
      - delivered
      - failed
