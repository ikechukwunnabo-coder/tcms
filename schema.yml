openapi: 3.0.3
info:
  title: TCMS API
  version: 0.1.0
  description: TASL Training Centre Management System API
paths:
  /api/v1/accounts/:
    get:
      operationId: v1_accounts_list
      description: |-
        ModelViewSet guarded by :class:`RolePermission`.

        Subclasses set ``required_roles`` / ``write_roles`` (tuples of RoleCode).
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          enum:
          - asset
          - equity
          - expense
          - income
          - liability
        description: |-
          * `asset` - Asset
          * `liability` - Liability
          * `equity` - Equity
          * `income` - Income
          * `expense` - Expense
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
    post:
      operationId: v1_accounts_create
      description: |-
        ModelViewSet guarded by :class:`RolePermission`.

        Subclasses set ``required_roles`` / ``write_roles`` (tuples of RoleCode).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Account'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Account'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
