components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 200
        type:
          $ref: '#/components/schemas/TypeEnum'
        parent:
          type: integer
          nullable: true
        active:
          type: boolean
      required:
      - code
      - id
      - name
      - type
    AccountTypeEnum:
      enum:
      - individual
      - corporate_lead
      - corporate_nominee
      type: string
      description: |-
        * `individual` - Individual
        * `corporate_lead` - Corporate lead
        * `corporate_nominee` - Corporate nominee
    Approval:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        training_record:
          type: integer
        current_status:
          type: integer
        step_no:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        assigned_role:
          type: integer
          nullable: true
        action:
          type: string
          maxLength: 16
        reason:
          type: string
        acted_by:
          type: integer
          nullable: true
        acted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - current_status
      - id
      - training_record
    ApprovalHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        training_record:
          type: integer
        status:
          type: integer
        full_name:
          type: string
          maxLength: 200
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - status
      - training_record
      - updated_at
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
        entity_id:
          type: integer
          readOnly: true
          nullable: true
        before:
          readOnly: true
          nullable: true
        after:
          readOnly: true
          nullable: true
        ip:
          type: string
          readOnly: true
          nullable: true
        at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - after
      - at
      - before
      - entity
      - entity_id
      - id
      - ip
    BlankEnum:
      enum:
      - ''
    Certificate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        training_record:
          type: integer
          readOnly: true
        learner:
          type: integer
          readOnly: true
        learner_name:
          type: string
          readOnly: true
        badge_no:
          type: string
          readOnly: true
        course_code:
          type: string
          readOnly: true
        certificate_no:
          type: string
          readOnly: true
        format:
          type: integer
          readOnly: true
          nullable: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        issued_by:
          type: integer
          readOnly: true
          nullable: true
        printed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        printed_by:
          type: integer
          readOnly: true
          nullable: true
        id_issued_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        id_printed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expiry_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        object_key:
          type: string
          readOnly: true
        md_approved_by:
          type: integer
          readOnly: true
          nullable: true
        md_approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        signature_applied:
          type: boolean
          readOnly: true
        seal_applied:
          type: boolean
          readOnly: true
        signature_object_key:
          type: string
          readOnly: true
        seal_object_key:
          type: string
          readOnly: true
        voided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        void_reason:
          type: string
          readOnly: true
        released_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Set when the certificate is dispatched (BR-17).
        renewed_by_certificate:
          type: integer
          readOnly: true
          nullable: true
          description: The superseding certificate, when this one has been renewed.
        batch:
          type: integer
          readOnly: true
          nullable: true
          description: Corporate ZIP batch this certificate ships in (BR-17a).
      required:
      - badge_no
      - batch
      - certificate_no
      - course_code
      - expiry_date
      - format
      - id
      - id_issued_at
      - id_printed_at
      - issued_at
      - issued_by
      - learner
      - learner_name
      - md_approved_at
      - md_approved_by
      - object_key
      - printed_at
      - printed_by
      - released_at
      - renewed_by_certificate
      - seal_applied
      - seal_object_key
      - signature_applied
      - signature_object_key
      - training_record
      - void_reason
      - voided_at
    CertificateBatch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        corporate_account:
          type: integer
          readOnly: true
        corporate_account_name:
          type: string
          readOnly: true
        zip_file_ref:
          type: string
          readOnly: true
        zip_file_hash:
          type: string
          readOnly: true
        certificate_count:
          type: integer
          readOnly: true
